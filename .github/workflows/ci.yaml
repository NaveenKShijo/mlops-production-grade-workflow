name: CI workflow to train ML model 
# run-name: ${{ github.actor }} is testing out GitHub Actions
on: [push]
jobs:
  ML_model_ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repository
        uses: actions/checkout@v4
      
      - name: set up python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.11"

      - name: download all dependencies
        run: pip install -r requirements.txt

      # - name: run test
      #   run: pytest

      - name: loginto dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}          
      
      - name: build docker image to train ML model 
        run: docker build -f docker/training/Dockerfile -t ${{secrets.DOCKER_USERNAME}}/ml_train:${{github.sha}} .

      - name: push docker image to dockerhub
        run: docker push ${{secrets.DOCKER_USERNAME}}/ml_train:${{github.sha}}
      
      
      - name: Submit sagemaker training jobs
        env: 
          GIT_COMMIT_SHA: ${{github.sha}}    
          GITHUB_REPO: ${{secrets.GITHUB_REPO}} # "NaveenKShijo/cicd-github_action-pipeline"
          # GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}  # For private repositories
          IMAGE_TAG: ${{github.sha}}
          MLFLOW_URI: ${{vars.MLFLOW_URI}}
          DOCKER_USERNAME: ${{vars.DOCKER_USERNAME}}
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}           # boto3 reads this automatically
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}   # boto3 reads this automatically
          AWS_DEFAULT_REGION: ${{vars.AWS_DEFAULT_REGION}}         # boto3 reads this automatically
          SAGEMAKER_ROLE: ${{secrets.SAGEMAKER_ROLE}}
          SAGEMAKER_INSTANCE_TYPE: ${{vars.SAGEMAKER_INSTANCE_TYPE}}
          SAGEMAKER_OUTPUT_PATH: ${{vars.SAGEMAKER_OUTPUT_PATH}}
        run: python src/pipeline/run_training.py 
      